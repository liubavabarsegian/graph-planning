services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: graphplanning
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d graphplanning"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  auth-service:
    build: ./services/auth-service
    ports:
      - "8082:8082"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_MODEL: ${OPENAI_MODEL:-gemma3:4b}
    # Запускаем сервер, ждём готовности, скачиваем модель, выставляем флаг.
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama serve & until curl -sf http://localhost:11434 > /dev/null 2>&1; do sleep 1; done; ollama pull $$OLLAMA_MODEL; touch /tmp/model-ready; wait"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/model-ready"]
      interval: 15s
      timeout: 5s
      retries: 40       # до ~10 мин на скачивание модели при первом запуске
      start_period: 30s
    # Для NVIDIA GPU раскомментировать:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

  chat-service:
    build: ./services/chat-service
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  graph-service:
    build: ./services/graph-service
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - chat-service
      - graph-service
    restart: unless-stopped

volumes:
  pg_data:
  neo4j_data:
  ollama_data:
