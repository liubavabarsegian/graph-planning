server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS — форсируем динамическое разрешение имён контейнеров.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/chat {
        set $chat http://chat-service:8080;
        proxy_pass $chat;
        proxy_set_header Host $host;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location /api/graph {
        set $graph http://graph-service:8081;
        proxy_pass $graph;
        proxy_set_header Host $host;
    }

    location /auth {
        set $auth http://auth-service:8082;
        proxy_pass $auth;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
